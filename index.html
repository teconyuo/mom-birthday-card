<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 手机端适配：按屏幕宽度缩放，并支持刘海屏安全区域 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF6EC">
  <meta name="description" content="送给妈妈的生日贺卡">
  <title>妈妈，生日快乐 ❤</title>

  <!-- 只用本地 CSS，不依赖任何外部框架 / CDN，离线也能正常打开 -->
  <link rel="stylesheet" href="style.css">

  <!-- 万一浏览器禁用了 JavaScript，文字也照样完整显示 -->
  <noscript><style>.reveal { opacity: 1 !important; transform: none !important; }</style></noscript>
</head>

<body>

  <!-- ================= ① 封面 ================= -->
  <header class="hero">
    <!-- 缓缓飘落的小花瓣（不想要可以整段删掉） -->
    <div class="petals" aria-hidden="true">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>

    <div class="hero-inner">
      <p class="hero-kicker">给我最爱的妈妈</p>
      <h1 class="hero-title">妈妈<br><span>生日快乐</span></h1>
      <p class="hero-sub">这一年，也想把最好的温柔都送给你</p>
      <!-- 点这个按钮：先放全屏烟花，烟花结束再平滑滑到蛋糕页面 -->
      <button id="openBtn" class="btn-main">打开贺卡 ❤</button>
    </div>

    <p class="scroll-hint" aria-hidden="true">↓</p>
  </header>

  <main>

    <!-- ================= ② 蛋糕与许愿 ================= -->
    <section id="cake-section" class="section">
      <h2 class="section-title reveal">许个愿吧</h2>

      <div class="cake-wrap reveal">
        <!-- 火花图层：吹蜡烛时由 script.js 在这里生成小火花 -->
        <div class="spark-layer" id="sparkLayer" aria-hidden="true"></div>

        <div class="cake" id="cake">
          <div class="candle"><span class="flame"></span></div>
          <div class="layer layer-top"></div>
          <div class="layer layer-bottom"></div>
          <div class="plate"></div>
        </div>
      </div>

      <div class="cake-actions reveal">
        <button id="blowBtn" class="btn-main btn-soft">轻轻吹灭蜡烛</button>
        <p id="wishText" class="wish-text">愿望已经悄悄收好啦 ✨</p>
      </div>
    </section>

    <!-- ================= ③ 心愿卡片 ================= -->
    <section class="section">
      <h2 class="section-title reveal">愿你</h2>

      <div class="wish-grid">
        <div class="wish-card reveal" style="--d:0ms">愿你每天都能睡个好觉，醒来有热乎的早饭。</div>
        <div class="wish-card reveal" style="--d:120ms">愿你的腰不再酸，腿不再疼，走多远都有力气。</div>
        <div class="wish-card reveal" style="--d:240ms">愿你喜欢的花一直开着，喜欢的人也一直陪着你。</div>
        <div class="wish-card reveal" style="--d:360ms">愿岁月温柔待你，像我小时候你待我那样。</div>
      </div>
    </section>

    <!-- ================= ④ 落款 ================= -->
    <section class="section sign">
      <p class="reveal">永远爱你的人</p>
      <p class="signature reveal" style="--d:150ms">—— <span id="signature">你的孩子</span></p>
      <p class="sig-heart reveal" style="--d:300ms">❤</p>
    </section>

  </main>

  <footer class="footer">
    <p>生日快乐，妈妈</p>
  </footer>

  <!-- 倒计时图层（新增）：点「打开贺卡」后出现 3 → 2 → 1，倒计时一结束就立刻放烟花 -->
  <div id="countdown" class="countdown" hidden aria-hidden="true">
    <p class="countdown-num" id="countdownNum"></p>
  </div>

  <!-- 全屏烟花图层：平时隐藏，点「打开贺卡」时由 script.js 打开并播放 -->
  <div id="fireworks" class="fireworks" hidden aria-hidden="true">
    <canvas id="fireworksCanvas"></canvas>
    <p class="fireworks-tip">轻触屏幕可以跳过</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
